{% extends "base.html" %}
{% block title %}{{ dataset_label }} - PanViewer{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-lg-6 text-center">
        <div class="alert alert-light border" role="alert">
            <i class="bi bi-inbox display-6 text-muted d-block mb-3"></i>
            <h5 class="mb-2">No data is available</h5>
            <p class="text-muted mb-0">The {{ dataset_label }} pan-genome is not loaded in this instance of PanViewer. Switch to <a href="{{ url_for('dataset', dataset_id=nav_default_dataset) }}">{{ nav_default_dataset|capitalize }}</a> to explore data.</p>
        </div>
    </div>
</div>
{% endblock %}
