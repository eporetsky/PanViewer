name: genetribe
channels:
  - conda-forge
  - bioconda
dependencies:
  # Pin <3.12: jcvi/MCscan (GeneTribe) is unreliable on newer Pythons.
  - python=3.11
  - bash
  - blast
  - bedtools
  - gawk
  - gzip
  - coreutils
  - findutils
  - sed
  - grep
  - parallel
  - sqlite
  - pip
  - pip:
      - jcvi
      - biopython
